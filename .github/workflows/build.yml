name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances système obligatoires
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev ccache

      - name: Installer Buildozer (version stable)
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install git+https://github.com

      - name: Lancer la compilation de l'APK
        run: |
          # Cette commande force l'acceptation automatique des licences de téléchargement Android
          yes | buildozer android debug

      - name: Télécharger l'APK générée
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Application-APK
          path: bin/*.apk
          
