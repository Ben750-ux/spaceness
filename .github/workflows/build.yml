name: Build APK Spaceness

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Compiler avec l'Action officielle Buildozer
        # Cet outil contient déjà Android pré-installé, évitant l'erreur 502 de Google
        uses: jbbandos/buildozer-action@main
        with:
          command: buildozer android debug
          repository_path: .

      - name: Télécharger l'APK générée
        uses: actions/upload-artifact@v4
        with:
          name: Spaceness-APK
          path: bin/*.apk
          
