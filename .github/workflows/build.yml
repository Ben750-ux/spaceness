name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'app.kv'
      - 'api_client.py'
      - 'broker/**'
      - 'requirements.txt'
      - 'buildozer.spec'

jobs:
  build:
    name: Construire APK Spaceness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.37 virtualenv

      - name: Installer Buildozer
        run: |
          pip install buildozer
          sudo apt update
          sudo apt install -y libffi-dev libssl-dev python3-dev zlib1g-dev\
            libltdl-dev libncurses5-dev libgdbm-dev libnss3-dev\
            libsqlite3-dev libreadline-dev libbz2-dev libgdbm-compat-dev\
            autoconf automake libtool pkg-config gcc make git\
            openjdk-17-jdk unzip

      - name: Builder l'APK
        run: |
          cd "$GITHUB_WORKSPACE"
          yes | buildozer -v android debug

      - name: Uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-spaceness
          path: bin/*.apk
